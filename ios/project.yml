# Fusebox voor iPhone. Het Xcode-project wordt hieruit gemaakt: `xcodegen generate` (of ./build.sh).
# Gedeelde code blijft in ../Sources staan; alleen de bestanden hieronder doen mee met de iPhone-app.
name: Fusebox
options:
  deploymentTarget: { iOS: "26.0" }
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "5.0"            # zelfde taalstand als de Mac (build.sh: -swift-version 5)
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Fusebox:
    type: application
    platform: iOS
    sources:
      - path: Fusebox
      - { path: ../Sources/Taal.swift, group: Shared }
      - { path: ../Sources/Theme.swift, group: Shared }
      - { path: ../Sources/Meten.swift, group: Shared }
      - { path: ../Sources/Netwerk.swift, group: Shared }
      - { path: ../Sources/NetwerkProbes.swift, group: Shared }
      - { path: ../Sources/NetwerkInternet.swift, group: Shared }
      - { path: ../Sources/NetwerkKaarten.swift, group: Shared }
      - { path: "../Resources/Fonts/Montserrat[wght].ttf", group: Shared/Fonts, buildPhase: resources }
      - { path: ../Resources/Fonts/Ubuntu-Regular.ttf, group: Shared/Fonts, buildPhase: resources }
      - { path: ../Resources/Fonts/Ubuntu-Medium.ttf, group: Shared/Fonts, buildPhase: resources }
      - { path: ../Resources/Fonts/Ubuntu-Bold.ttf, group: Shared/Fonts, buildPhase: resources }
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Fusebox
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleLocalizations: [en, nl, de, fr, es]
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        UIAppFonts: ["Montserrat[wght].ttf", Ubuntu-Regular.ttf, Ubuntu-Medium.ttf, Ubuntu-Bold.ttf]
        NSLocalNetworkUsageDescription: Fusebox looks for the devices on your Wi-Fi and measures how fast your router answers.
        # Moet gelijk zijn aan NetScanner.serviceTypes (Sources/Netwerk.swift); de zelftest controleert dat.
        NSBonjourServices:
          - _device-info._tcp
          - _companion-link._tcp
          - _airplay._tcp
          - _raop._tcp
          - _googlecast._tcp
          - _sonos._tcp
          - _spotify-connect._tcp
          - _ipp._tcp
          - _printer._tcp
          - _scanner._tcp
          - _smb._tcp
          - _afpovertcp._tcp
          - _workstation._tcp
          - _ssh._tcp
          - _sftp-ssh._tcp
          - _rfb._tcp
          - _hap._tcp
          - _hap._udp
          - _homekit._tcp
          - _http._tcp
          - _meshcop._udp
          - _matter._tcp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.joelonhtml.fusebox
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_USER_SCRIPT_SANDBOXING: "NO"
        SWIFT_EMIT_LOC_STRINGS: "YES"
        CODE_SIGN_STYLE: Automatic
    postBuildScripts:
      - name: Vertalingen samenvoegen
        basedOnDependencyAnalysis: false
        script: |
          # Mac-vertalingen (../Resources) + teksten die alleen de iPhone heeft (Strings/) → één tabel per taal.
          for l in en nl de fr es; do
            d="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/$l.lproj"
            mkdir -p "$d"
            cat "$SRCROOT/../Resources/$l.lproj/Localizable.strings" "$SRCROOT/Strings/$l.strings" > "$d/Localizable.strings"
            cp "$SRCROOT/Strings/$l.InfoPlist.strings" "$d/InfoPlist.strings"
          done
